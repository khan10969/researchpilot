[project]
name = "researchpilot"
version = "0.1.0"
description = "Evidence-grounded research literature and experiment analysis assistant with traceable citations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "openai>=3.7.0",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "sentence-transformers>=6.0.1",
    "sse-starlette>=3.4.8",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "typer>=0.26.8,<0.27",
    "uvicorn[standard]>=0.52.4",
    "torch>=2.13,<2.14",
    "torchvision>=0.28,<0.29",
    "docling>=2.124,<3",
]

[project.scripts]
researchpilot = "researchpilot:main"

[project.optional-dependencies]
agent = [
    "langgraph>=1.2.11",
]
web = [
    "plotly>=7.0.0",
    "streamlit>=1.63.0",
]
eval = [
    "langfuse>=4.15.1",
    "ragas>=0.3.1",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.5",
]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires real Docker and Qdrant",
    "live_llm: calls a real LLM API and may incur cost",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    ".venv",
    "data",
    "evals/runs",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
]
ignore = [
    # FastAPI 官方依赖注入写法需要调用 Depends/File
    "B008",
]