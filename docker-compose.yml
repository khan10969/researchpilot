services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: researchpilot-qdrant
    restart: unless-stopped

    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
    name: researchpilot_qdrant_data